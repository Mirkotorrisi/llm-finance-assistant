[project]
name = "llm-finance-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "finance-mcp",
    "openai",
    "python-dotenv",
    "pandas",
    "pypdf2",
    "openpyxl",
    "python-multipart",
    "httpx>=0.28.1",
    "xlrd>=2.0.2",
]

[tool.uv.sources]
# the agent tools (registry, schemas, API client) live in finance-mcp: the OpenAI backend imports them
finance-mcp = { path = "../finance-mcp" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "xlwt>=1.3.0",
]
